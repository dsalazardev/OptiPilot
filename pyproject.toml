[project]
name = "optipilot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4",
    "opencv-python-headless>=4.13",
    # Canal Bluetooth Classic SPP hacia el robot (specs/002, US4/FR-028).
    # Único uso: src/transporte/spp.py. No es un modelo aprendido, luego no
    # viola la restricción de técnicas del Reto 1 (Principio I).
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "footage: validación con footage real (opt-in vía OPTIPILOT_VIDEO_DIR)",
    "perf: benchmark de latencia (no bloqueante)",
]
