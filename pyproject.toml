[project]
name = "optipilot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4",
    "opencv-python-headless>=4.13",
    # El canal Bluetooth Classic hacia el mBot usa sockets RFCOMM de la
    # biblioteca estándar (`socket.AF_BLUETOOTH`), así que no hace falta ninguna
    # dependencia de terceros. Se retiró `pyserial` cuando el profesor confirmó
    # el protocolo: el enlace es RFCOMM puro, no un puerto COM.
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "footage: validación con footage real (opt-in vía OPTIPILOT_VIDEO_DIR)",
    "perf: benchmark de latencia (no bloqueante)",
]
